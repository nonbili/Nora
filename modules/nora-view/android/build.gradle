apply plugin: 'com.android.library'

group = 'expo.modules.noraview'
version = '0.7.2'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.noraview"
  flavorDimensions "distribution"
  productFlavors {
    full {
      dimension "distribution"
    }
    foss {
      dimension "distribution"
    }
  }
  defaultConfig {
    versionCode 1
    versionName "0.7.2"
    consumerProguardFiles "proguard-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.lifecycle:lifecycle-process:2.9.3"
  implementation "org.apache.tika:tika-core:3.2.3"
  implementation "androidx.webkit:webkit:1.13.0"
  implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
  fullImplementation "com.google.mlkit:translate:17.0.3"
  fullImplementation "com.google.mlkit:language-id:17.0.6"
  testImplementation "junit:junit:4.13.2"
}

// Build a native asset too: a pinned site can start without React loading Expo assets.
def standaloneAssets = layout.buildDirectory.dir("generated/standaloneAssets")
def bundleStandalone = tasks.register('bundleStandalone', Exec) {
  workingDir rootProject.projectDir.parentFile
  inputs.dir new File(workingDir, 'content')
  inputs.dir new File(workingDir, 'lib')
  inputs.file new File(workingDir, 'bun.lock')
  outputs.dir standaloneAssets
  commandLine 'node', 'node_modules/esbuild/bin/esbuild', 'content/standalone.ts', 'content/youtube.ts',
    '--bundle', '--format=iife', '--target=chrome100',
    "--outdir=${standaloneAssets.get().asFile}", '--entry-names=nora-[name]'
}
android.sourceSets.main.assets.srcDir standaloneAssets.get().asFile
tasks.named('preBuild').configure { dependsOn bundleStandalone }
