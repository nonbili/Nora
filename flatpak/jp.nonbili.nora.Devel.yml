# Local test build of the Flathub manifest, using this checkout instead of release tarballs.
# Uses a separate app ID so it can be installed alongside the Flathub release. See README.md.
app-id: jp.nonbili.nora.Devel
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run.sh
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.chromium.*
modules:
  - name: nora
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/run/build/nora/bin
      env:
        VITE_BUILD_TARGET: portable
    build-commands:
      - bun run bundle
      - |
        cd desktop
        bun electron-vite build
        bun electron-builder --dir --publish never --config.electronDist=../node_modules/electron/dist
        cp -a dist/linux*unpacked /app/main

      - install -Dm755 -t /app/bin/ ./run.sh
      - |
        sed -e 's/^Name=Nora$/Name=Nora (Devel)/' -e 's/^Icon=jp.nonbili.nora$/Icon=jp.nonbili.nora.Devel/' \
          metadata/flatpak/jp.nonbili.nora.desktop > jp.nonbili.nora.Devel.desktop
        sed -e 's/jp\.nonbili\.nora</jp.nonbili.nora.Devel</' -e 's/jp\.nonbili\.nora\.desktop/jp.nonbili.nora.Devel.desktop/' \
          -e 's/<name>Nora<\/name>/<name>Nora (Devel)<\/name>/' \
          metadata/flatpak/jp.nonbili.nora.metainfo.xml > jp.nonbili.nora.Devel.metainfo.xml
      - install -Dm644 jp.nonbili.nora.Devel.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 jp.nonbili.nora.Devel.desktop -t /app/share/applications/
      - install -Dm644 desktop/icon.png /app/share/icons/hicolor/512x512/apps/jp.nonbili.nora.Devel.png
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - flatpak
          - android
          - dist
          - desktop/dist
          - desktop/out

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-x64.zip
        sha256: 400824c82bfcc0854365bcada11cf53d7384ecb1e2c3da0e2c0a2c6a527d5629
        dest: bin
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-aarch64.zip
        sha256: 65666a18439e891e5751b666103fe591a8519f11b66ec4bd8654c5515d4fff8a
        dest: bin
        only-arches: [aarch64]

      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/Nora "$@"
