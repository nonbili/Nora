name: Build APK

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: install and prebuild
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install

      - name: build apk
        run: ./gradlew assembleFullRelease --stacktrace
        working-directory: android

      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: set build tool version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo build tool version: $BUILD_TOOL_VERSION
          echo "VERSION_CODE=$(jq -r '.versionCode' package.json)" >> $GITHUB_ENV

      - uses: r0adkll/sign-android-release@v1
        name: sign apk
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: rename apk
        run: |
          sudo apt-get update && sudo apt-get install -y rename
          rename 's/release-unsigned-signed/release/' *.apk
        working-directory: android/app/build/outputs/apk/full/release

      - uses: softprops/action-gh-release@v2
        name: upload apk
        with:
          body_path: metadata/en-US/changelogs/${{ env.VERSION_CODE }}04.txt
          files: android/app/build/outputs/apk/full/release/*-release.apk

  build-foss:
    name: Build FOSS APKs
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: install and prebuild FOSS variant
        run: |
          rm -rf modules/nora-view/android/src/full
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install
          echo "" >> android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' >> android/gradle.properties
          echo 'org.gradle.workers.max=2' >> android/gradle.properties
          echo 'org.gradle.parallel=false' >> android/gradle.properties

      - name: build FOSS APKs
        run: ./gradlew assembleFossRelease --stacktrace
        working-directory: android

      - name: verify FOSS APKs
        run: |
          test -f app-foss-armeabi-v7a-release-unsigned.apk
          test -f app-foss-arm64-v8a-release-unsigned.apk
          for apk in app-foss-*-release-unsigned.apk; do
            if unzip -p "$apk" 'classes*.dex' | strings | grep -E 'com[./]google[./]mlkit'; then
              echo "ML Kit reference found in $apk"
              exit 1
            fi
          done
        working-directory: android/app/build/outputs/apk/foss/release
